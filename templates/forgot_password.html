{% extends "base.html" %}

{% block auth_content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
  <div class="card p-4 p-sm-5 border shadow-lg" style="max-width: 460px; width: 100%; border-radius: 20px; background-color: var(--bg-card);">
    <div class="text-center mb-4">
      <div class="stat-icon bg-primary text-white mx-auto mb-3" style="width: 56px; height: 56px; border-radius: 14px;">
        <i class="fa-solid fa-key fs-4"></i>
      </div>
      <h3 class="fw-bold tracking-tight mb-1">Reset Password</h3>
      <p class="text-muted" style="font-size: 0.88rem;">Enter your email to receive recovery instructions via Firebase.</p>
    </div>

    <div id="auth-alert-container"></div>

    <form id="forgot-password-form">
      <div class="mb-4">
        <label for="email" class="form-label text-uppercase fw-semibold" style="font-size: 0.72rem; letter-spacing: 0.5px;">Registered Email Address</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-envelope prefix-icon"></i>
          <input type="email" id="email" class="form-control form-control-custom" placeholder="name@company.com" required>
        </div>
      </div>

      <button type="submit" id="reset-btn" class="btn btn-primary w-100 py-2.5 fw-semibold mb-3" style="border-radius: 12px;">
        Send Reset Email
      </button>

      <div class="text-center">
        <a href="{{ url_for('auth.login') }}" class="text-decoration-none text-muted" style="font-size: 0.85rem;">
          <i class="fa-solid fa-arrow-left me-1"></i> Return to Sign In
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
