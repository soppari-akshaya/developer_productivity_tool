{% extends "base.html" %}

{% block content %}
<div class="container-fluid p-0">
  <div class="card border p-4 shadow-sm" style="border-radius: 16px; background-color: var(--bg-card);">
    <!-- Editor Header Toolbar -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
      <div>
        <h5 class="fw-bold mb-1"><i class="fa-solid fa-terminal text-primary me-2"></i>Online Code Editor</h5>
        <p class="text-muted mb-0" style="font-size: 0.85rem;">In-browser syntax-highlighted scratchpad with CodeMirror.</p>
      </div>

      <div class="d-flex align-items-center gap-2">
        <select id="editor-language-select" class="form-select form-select-sm" style="max-width: 150px; border-radius: 8px;">
          <option value="javascript">JavaScript</option>
          <option value="python">Python</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="sql">SQL</option>
        </select>

        <button type="button" id="btn-run-code" class="btn btn-sm btn-success" style="border-radius: 8px;">
          <i class="fa-solid fa-play me-1"></i> Run Code
        </button>

        <button type="button" id="btn-save-snippet" class="btn btn-sm btn-outline-primary" style="border-radius: 8px;" title="Save to snippet vault">
          <i class="fa-solid fa-bookmark me-1"></i> Save Snippet
        </button>

        <button type="button" id="btn-download-code" class="btn btn-sm btn-outline-secondary" style="border-radius: 8px;" title="Download file">
          <i class="fa-solid fa-download"></i>
        </button>

        <button type="button" id="btn-clear-code" class="btn btn-sm btn-outline-danger" style="border-radius: 8px;" title="Clear editor">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
    </div>

    <!-- CodeMirror Editor Textarea -->
    <div class="border rounded-3 overflow-hidden mb-3">
      <textarea id="code-editor-textarea">// Online Code Scratchpad
// Write or paste your code here...
</textarea>
    </div>

    <!-- Output Terminal -->
    <div class="card border p-3" style="background-color: var(--bg-primary); border-radius: 12px;">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-uppercase fw-bold text-muted" style="font-size: 0.72rem; letter-spacing: 0.5px;">
          <i class="fa-solid fa-laptop-code me-1"></i> Isolated Execution Output
        </span>
      </div>
      <pre id="editor-output" class="font-monospace text-success mb-0" style="font-size: 0.82rem; min-height: 70px; white-space: pre-wrap;">Ready to execute. Click "Run Code" above.</pre>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/editor.js') }}"></script>
{% endblock %}
