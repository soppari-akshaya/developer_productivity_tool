{% extends "base.html" %}

{% block content %}
<div class="container-fluid p-0">
  <div class="card border p-4 shadow-sm mx-auto" style="max-width: 600px; border-radius: 16px; background-color: var(--bg-card);">
    <h5 class="fw-bold mb-1">Edit Project: {{ project.name }}</h5>
    <p class="text-muted mb-4" style="font-size: 0.85rem;">Update deliverables, timeline, or progress percentage.</p>

    <form method="POST" action="{{ url_for('projects.edit', project_id=project.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label class="form-label text-uppercase fw-semibold" style="font-size: 0.72rem;">Project Name</label>
        <input type="text" name="name" class="form-control form-control-custom" value="{{ project.name }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label text-uppercase fw-semibold" style="font-size: 0.72rem;">Description</label>
        <textarea name="description" class="form-control form-control-custom" rows="3">{{ project.description or '' }}</textarea>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-6">
          <label class="form-label text-uppercase fw-semibold" style="font-size: 0.72rem;">Progress ({{ project.progress }}%)</label>
          <input type="range" name="progress" min="0" max="100" class="form-range" value="{{ project.progress }}">
        </div>
        <div class="col-6">
          <label class="form-label text-uppercase fw-semibold" style="font-size: 0.72rem;">Status</label>
          <select name="status" class="form-select form-control-custom">
            <option value="planning" {% if project.status == 'planning' %}selected{% endif %}>Planning</option>
            <option value="active" {% if project.status == 'active' %}selected{% endif %}>Active</option>
            <option value="on_hold" {% if project.status == 'on_hold' %}selected{% endif %}>On Hold</option>
            <option value="completed" {% if project.status == 'completed' %}selected{% endif %}>Completed</option>
          </select>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-6">
          <label class="form-label text-uppercase fw-semibold" style="font-size: 0.72rem;">Priority</label>
          <select name="priority" class="form-select form-control-custom">
            <option value="low" {% if project.priority == 'low' %}selected{% endif %}>Low</option>
            <option value="medium" {% if project.priority == 'medium' %}selected{% endif %}>Medium</option>
            <option value="high" {% if project.priority == 'high' %}selected{% endif %}>High</option>
            <option value="critical" {% if project.priority == 'critical' %}selected{% endif %}>Critical</option>
          </select>
        </div>
        <div class="col-6">
          <label class="form-label text-uppercase fw-semibold" style="font-size: 0.72rem;">Target Deadline</label>
          <input type="date" name="end_date" class="form-control form-control-custom" value="{{ project.end_date.strftime('%Y-%m-%d') if project.end_date else '' }}">
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a href="{{ url_for('projects.detail', project_id=project.id) }}" class="btn btn-outline-secondary btn-sm px-3">Cancel</a>
        <button type="submit" class="btn btn-primary btn-sm px-4">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
